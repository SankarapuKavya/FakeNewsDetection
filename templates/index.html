<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>

    <!-- CSS Link (IMPORTANT for Render projects) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2b5876);
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 55%;
            margin: auto;
            margin-top: 60px;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 90%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            background: #00c6ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
            transform: scale(1.05);
        }

        h2 {
            margin-top: 25px;
            font-size: 24px;
        }

        .fake {
            color: #ff4d4d;
            font-weight: bold;
        }

        .real {
            color: #00ff99;
            font-weight: bold;
        }

        .neutral {
            color: #ffd700;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>📰 Fake News Detection System</h1>

        <form action="/predict" method="post">
            <textarea name="news" placeholder="Enter news statement here..." required></textarea>
            <br>
            <button type="submit">Check News</button>
        </form>

        <!-- Result -->
        {% if prediction_text %}
            <h2
                class="{% if 'Fake' in prediction_text %}fake
                        {% elif 'Real' in prediction_text %}real
                        {% else %}neutral{% endif %}">
                {{ prediction_text }}
            </h2>
        {% endif %}

    </div>

</body>
</html>
